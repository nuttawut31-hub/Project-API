openapi: 3.0.3
info:
  title: Gym Membership Management API
  description: |
    ระบบบริหารจัดการสาขาฟิตเนสและสมาชิก (Fitness Gym Management System)

    ระบบนี้ให้บริการ RESTful API สำหรับ:
    - จัดการข้อมูลสาขาฟิตเนส (Gyms)
    - จัดการข้อมูลสมาชิก (Members)
    - จัดการการสมัครสมาชิก (Memberships)
    - ดึงข้อมูลสภาพอากาศ (External API — Open-Meteo)

    **รหัสนิสิต:** 67160028 | **ระบบ:** 9 (Fitness Gym)
  version: 3.0.0
  contact:
    name: Student 67160028
servers:
  - url: http://localhost:3000
    description: Local Development Server
tags:
  - name: Auth
    description: เข้าสู่ระบบพนักงานและตรวจ session
  - name: Gyms
    description: จัดการข้อมูลสาขาฟิตเนส
  - name: Members
    description: จัดการข้อมูลสมาชิก
  - name: Memberships
    description: จัดการการสมัครสมาชิกและสถานะ
  - name: Weather
    description: ข้อมูลสภาพอากาศจาก External API (Open-Meteo)
paths:
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: เข้าสู่ระบบด้วยบัญชี staff หรือ admin
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: ได้ JWT อายุ 2 ชั่วโมง
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: ตรวจ token และดูผู้ใช้ปัจจุบัน
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: บัญชีที่ยังมีอยู่ในฐานข้อมูล
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/gyms:
    get:
      tags:
        - Gyms
      summary: ดูรายการสาขาฟิตเนสทั้งหมด
      description: คืนรายการสาขาฟิตเนสทั้งหมดในระบบ รองรับการกรองด้วย max_fee
      operationId: getAllGyms
      parameters:
        - in: query
          name: max_fee
          schema:
            type: number
            minimum: 0
            example: 1500
          description: กรองสาขาที่มี monthly_fee ไม่เกินจำนวนที่ระบุ ต้องเป็นตัวเลขตั้งแต่ 0 ขึ้นไป
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymsListResponse'
              example:
                success: true
                count: 2
                data:
                  - id: 1
                    name: FitLife Siam Paragon
                    address: 991 Rama I Rd, Pathum Wan, Bangkok
                    monthly_fee: '1500.00'
                    phone_number: 02-123-4567
                    created_at: '2026-01-01T00:00:00.000Z'
                    updated_at: '2026-01-01T00:00:00.000Z'
                    latitude: 13.7468
                    longitude: 100.53494
        '400':
          description: max_fee ไม่ใช่ตัวเลขหรือมีค่าน้อยกว่า 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: max_fee must be a non-negative number
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Gyms
      summary: เพิ่มสาขาฟิตเนสใหม่
      description: ส่ง latitude และ longitude มาพร้อมกันเมื่อทราบตำแหน่งจริง; หากไม่ส่งทั้งคู่ สาขาจะยังไม่มีพิกัด
      operationId: createGym
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GymInput'
            example:
              name: FitLife On Nut
              address: 888 Sukhumvit 77, Bangkok
              monthly_fee: 1400
              phone_number: 02-456-7890
              latitude: 13.7
              longitude: 100.6
      responses:
        '201':
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymResponse'
              example:
                success: true
                message: Gym created successfully
                data:
                  id: 4
                  name: FitLife On Nut
                  address: 888 Sukhumvit 77, Bangkok
                  monthly_fee: '1400.00'
                  phone_number: 02-456-7890
                  latitude: 13.7
                  longitude: 100.6
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/gyms/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags:
        - Gyms
      summary: ดูข้อมูลสาขาฟิตเนสตาม ID
      operationId: getGymById
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Gyms
      summary: แก้ไขข้อมูลสาขาฟิตเนส
      description: ต้องส่งข้อมูลหลักของสาขาครบ; ส่งพิกัด latitude และ longitude เป็นคู่, ละทั้งคู่ไว้เพื่อคงพิกัดเดิม, หรือส่งทั้งคู่เป็น null เพื่อล้างพิกัด
      operationId: updateGym
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GymInput'
      responses:
        '200':
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Gyms
      summary: ลบสาขาฟิตเนส
      description: การลบสาขาจะลบประวัติการสมัครที่อ้างถึงสาขานี้ด้วย และต้องใช้สิทธิ์ admin
      operationId: deleteGym
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ลบสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                success: true
                message: Gym deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/gyms/{gymId}/memberships:
    get:
      tags:
        - Gyms
        - Memberships
      summary: ดูรายการสมาชิกทั้งหมดของสาขาฟิตเนส
      operationId: getGymMemberships
      parameters:
        - in: path
          name: gymId
          required: true
          schema:
            type: integer
          description: ID ของสาขาฟิตเนส
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  gym_name:
                    type: string
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MembershipDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/members:
    get:
      tags:
        - Members
      summary: ดูรายการสมาชิกทั้งหมด
      operationId: getAllMembers
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Members
      summary: ลงทะเบียนสมาชิกใหม่
      operationId: createMember
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
            example:
              full_name: Somchai Jaidee
              email: somchai.j@example.com
              phone_number: 081-111-2222
              join_date: '2026-01-01'
      responses:
        '201':
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: อีเมลซ้ำในระบบ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Email already exists
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/members/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags:
        - Members
      summary: ดูข้อมูลสมาชิกตาม ID
      operationId: getMemberById
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Members
      summary: แก้ไขข้อมูลสมาชิก
      operationId: updateMember
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '200':
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Members
      summary: ลบสมาชิก
      operationId: deleteMember
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ลบสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/memberships:
    get:
      tags:
        - Memberships
      summary: ดูรายการสมัครสมาชิกทั้งหมด
      operationId: getAllMemberships
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MembershipDetail'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Memberships
      summary: สมัครสมาชิกประจำสาขา
      operationId: createMembership
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipInput'
            example:
              member_id: 1
              gym_id: 2
              start_date: '2026-03-01'
              end_date: '2026-09-01'
      responses:
        '201':
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/memberships/{id}/status:
    put:
      tags:
        - Memberships
      summary: อัปเดตสถานะการสมัครสมาชิก
      operationId: updateMembershipStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - ACTIVE
                    - EXPIRED
                    - CANCELLED
                  example: EXPIRED
      responses:
        '200':
          description: อัปเดตสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/weather:
    get:
      tags:
        - Weather
      summary: ดูสภาพอากาศปัจจุบัน (External API — Open-Meteo)
      description: |
        ดึงข้อมูลสภาพอากาศจาก Open-Meteo API เพื่อแนะนำสมาชิกว่าเหมาะกับ
        การออกกำลังกายกลางแจ้งหรือควรมาใช้บริการที่สาขาฟิตเนส

        ระบบมี **Retry Logic** (fetchWithRetry สูงสุด 2 ครั้ง + Exponential Backoff พร้อม Equal Jitter),
        **Timeout** (3 วินาที), และ **Fallback** (คืนค่า default เมื่อล้มเหลว)
      operationId: getWeather
      parameters:
        - in: query
          name: lat
          schema:
            type: number
            minimum: -90
            maximum: 90
            default: 13.7563
          description: ละติจูด; ต้องส่งคู่กับ lon; หากไม่ส่งทั้งคู่จะใช้พิกัดกรุงเทพฯ (13.7563, 100.5018)
        - in: query
          name: lon
          schema:
            type: number
            minimum: -180
            maximum: 180
            default: 100.5018
          description: ลองจิจูด; ต้องส่งคู่กับ lat; หากไม่ส่งทั้งคู่จะใช้พิกัดกรุงเทพฯ (13.7563, 100.5018)
      responses:
        '200':
          description: สำเร็จ (จาก External API หรือ Fallback)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      weather:
                        type: object
                        properties:
                          source:
                            type: string
                            enum:
                              - external
                              - fallback
                            description: แหล่งที่มาของข้อมูล (external = API ภายนอก, fallback = ข้อมูลสำรอง)
                          available:
                            type: boolean
                            description: สถานะความพร้อมของข้อมูลสภาพอากาศ
                          temperature:
                            type: number
                            nullable: true
                            description: อุณหภูมิปัจจุบัน (°C)
                          windspeed:
                            type: number
                            nullable: true
                            description: ความเร็วลม (km/h)
                          weathercode:
                            type: integer
                            nullable: true
                            description: รหัสสภาพอากาศ WMO
                          time:
                            type: string
                            nullable: true
                            description: เวลาที่บันทึกข้อมูลสภาพอากาศ
                          note:
                            type: string
                            nullable: true
                            description: ข้อความแนะนำหรือแจ้งเตือน
              examples:
                external_success:
                  summary: 'ดึงข้อมูลจาก Open-Meteo สำเร็จ (source: external)'
                  value:
                    data:
                      weather:
                        source: external
                        available: true
                        temperature: 25.4
                        windspeed: 7.9
                        weathercode: 95
                        time: 2026-10-10T15:00
                        note: null
                fallback_response:
                  summary: 'Fallback เมื่อ External API ล้มเหลว (source: fallback)'
                  value:
                    data:
                      weather:
                        source: fallback
                        available: false
                        temperature: null
                        windspeed: null
                        weathercode: null
                        time: null
                        note: ไม่สามารถดึงข้อมูลสภาพอากาศจากบริการภายนอกได้ในขณะนี้ กรุณาลองใหม่ภายหลัง
        '400':
          description: ต้องส่ง lat และ lon พร้อมกัน และค่าต้องอยู่ในช่วงพิกัดที่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: lat and lon must be provided together
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdParam:
      in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
      description: ID ของ resource
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - staff
            - admin
    GymInput:
      type: object
      required:
        - name
        - address
        - monthly_fee
        - phone_number
      properties:
        name:
          type: string
          maxLength: 100
          example: FitLife Siam Paragon
        address:
          type: string
          maxLength: 255
          example: 991 Rama I Rd, Pathum Wan, Bangkok
        monthly_fee:
          type: number
          format: float
          minimum: 0
          example: 1500
        phone_number:
          type: string
          maxLength: 20
          example: 02-123-4567
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
          description: พิกัดละติจูด ไม่บังคับ; ต้องส่งคู่กับ longitude. หากเว้นทั้งคู่จะเก็บเป็น null
          example: 13.7468
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
          description: พิกัดลองจิจูด ไม่บังคับ; ต้องส่งคู่กับ latitude. หากเว้นทั้งคู่จะเก็บเป็น null
          example: 100.53494
    Gym:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          example: FitLife Siam Paragon
        address:
          type: string
          maxLength: 255
          example: 991 Rama I Rd, Pathum Wan, Bangkok
        monthly_fee:
          type: string
          example: '1500.00'
        phone_number:
          type: string
          maxLength: 20
          example: 02-123-4567
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
          example: 13.7468
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
          example: 100.53494
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GymResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Gym'
    GymsListResponse:
      type: object
      properties:
        success:
          type: boolean
        count:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/Gym'
    MemberInput:
      type: object
      required:
        - full_name
        - email
        - phone_number
        - join_date
      properties:
        full_name:
          type: string
          maxLength: 100
          example: Somchai Jaidee
        email:
          type: string
          format: email
          maxLength: 100
          example: somchai.j@example.com
        phone_number:
          type: string
          maxLength: 20
          example: 081-111-2222
        join_date:
          type: string
          format: date
